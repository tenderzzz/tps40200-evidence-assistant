[project]
name = "tps40200-evidence"
version = "0.4.0"
description = "Local, traceable multi-chip datasheet search and bounded engineering checks"
requires-python = ">=3.12,<3.15"
dependencies = ["pdfplumber>=0.11,<0.12", "pydantic>=2.10,<3", "streamlit>=1.45,<2", "rank-bm25>=0.2.2,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tps-evidence = "tps_evidence.cli:main"
tps-workbench = "tps_evidence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tps_evidence"]
